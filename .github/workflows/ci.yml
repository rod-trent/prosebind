name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test "packages/*/dist/**/*.test.js"

      # The engine must find the planted errors in the worked example, and must
      # exit 1 when it does. A green build that stopped detecting anything is worse
      # than a red one.
      - name: Worked example still detects its planted errors
        shell: bash
        run: |
          set +e
          output=$(node packages/daemon/dist/cli.js check examples/the-quarry)
          code=$?
          echo "$output"
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 from a manuscript with planted contradictions, got $code"
            exit 1
          fi
          for check in deceased-active name-variant attribute-contradiction age-arithmetic; do
            echo "$output" | grep -q "$check" || { echo "::error::$check stopped firing"; exit 1; }
          done

      # The extension must package into a self-contained vsix. Without bundling, npm
      # workspace hoisting leaves vscode-languageclient out and the extension fails to
      # activate for everyone except the person who built it.
      - name: Extension packages into a valid vsix
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        working-directory: clients/vscode
        run: npx --yes @vscode/vsce@latest package --no-dependencies --out /tmp/prosebind.vsix

      # The Obsidian plugin loads main.js from the plugin folder root. A build that
      # leaves it in dist/ produces a plugin Obsidian silently never shows.
      - name: Obsidian plugin bundles where Obsidian looks for it
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        shell: bash
        run: |
          test -f clients/obsidian/main.js || { echo "::error::main.js missing"; exit 1; }
          test -f clients/obsidian/manifest.json || { echo "::error::manifest.json missing"; exit 1; }
          test -f clients/obsidian/styles.css || { echo "::error::styles.css missing"; exit 1; }

      # Both servers must work as spawned binaries, not just in-process. This catches
      # bin wiring and stdout contamination, which unit tests cannot see.
      - name: Servers answer over stdio
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        shell: bash
        run: |
          node packages/lsp/dist/cli.js --help >/dev/null 2>&1 || { echo "::error::lsp cli failed"; exit 1; }
          node packages/mcp/dist/cli.js --help >/dev/null 2>&1 || { echo "::error::mcp cli failed"; exit 1; }

      # Incrementality is a correctness claim, not just a speed one: the demo exits
      # non-zero if the incremental path ever disagrees with a cold start.
      - name: Incremental analysis matches a cold start
        run: node scripts/incremental-demo.mjs
